name: .NET Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dotnet-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  SOLUTION: EventHorizon.LfuCache.slnx

jobs:
  validate:
    name: Format, build, test, and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-dotnet10-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.*.props') }}
          restore-keys: |
            ${{ runner.os }}-dotnet10-nuget-

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Verify formatting
        run: dotnet format "$SOLUTION" --no-restore --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test tests/EventHorizon.LfuCache.Tests/EventHorizon.LfuCache.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --settings tests/EventHorizon.LfuCache.Tests/coverage.runsettings
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          directory: ${{ github.workspace }}/TestResults
          fail_ci_if_error: true

      - name: Pack
        run: >-
          dotnet pack src/EventHorizon.LfuCache/EventHorizon.LfuCache.csproj
          --configuration Release
          --no-build
          --no-restore

  net8-build:
    name: Build .NET 8 target with .NET 8 SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Select installed .NET 8 SDK
        shell: bash
        run: |
          sdk_version="$(dotnet --list-sdks | awk '$1 ~ /^8\.0\./ { print $1 }' | sort -V | tail -n 1)"

          if [[ -z "$sdk_version" ]]; then
            echo "::error title=Missing .NET 8 SDK::actions/setup-dotnet did not install a .NET 8 SDK."
            exit 1
          fi

          printf '{\n  "sdk": {\n    "version": "%s",\n    "rollForward": "latestPatch",\n    "allowPrerelease": false\n  }\n}\n' \
            "$sdk_version" > global.json
          dotnet --version

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-dotnet8-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.*.props') }}
          restore-keys: |
            ${{ runner.os }}-dotnet8-nuget-

      - name: Restore .NET 8 target
        run: >-
          dotnet restore src/EventHorizon.LfuCache/EventHorizon.LfuCache.csproj
          -p:TargetFrameworks=net8.0

      - name: Build .NET 8 target
        run: >-
          dotnet build src/EventHorizon.LfuCache/EventHorizon.LfuCache.csproj
          --configuration Release
          --no-restore
          -p:TargetFrameworks=net8.0
